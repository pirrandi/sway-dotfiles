# ============================================
# VENTANAS FLOTANTES
# ============================================

# OTPClient — scratchpad
for_window [app_id="com.github.paolostivanin.OTPClient"] {
    floating enable
    resize set 380 520
    move position center
    move to scratchpad
}

# Tidal — scratchpad
for_window [app_id="tidal-hifi"] {
    floating enable
    resize set 1000 700
    move position center
    move to scratchpad
}
